name: Auto-Sync GitHub Stats & Streak

on:
  schedule:
    - cron: '0 */6 * * *' # Automatically runs every 6 hours
  workflow_dispatch: # Allows manual trigger anytime
  push:
    branches:
      - main
    paths-ignore:
      - 'assets/**'
      - 'README.md'

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Stats Generator
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python .github/scripts/generate_stats.py

      - name: Commit & Push Updated Stats Cards
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg assets/streak-stats.svg
          if git diff --staged --quiet; then
            echo "No stats changes detected."
          else
            git commit -m "chore(stats): auto-update stats & streak cards with latest activity"
            git pull --rebase origin main
            git push origin main
          fi
