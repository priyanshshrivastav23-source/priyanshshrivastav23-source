name: Auto-Sync GitHub Stats & Commits

on:
  schedule:
    - cron: '0 */2 * * *' # Automatically runs every 2 hours
  workflow_dispatch: # Allows manual trigger anytime
  push:
    branches:
      - main

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Stats Generator
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python .github/scripts/generate_stats.py

      - name: Commit & Push Updated Stats Card
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg
          if git diff --staged --quiet; then
            echo "No stats changes detected."
          else
            git commit -m "chore(stats): auto-update stats card with latest commits"
            git push
          fi
